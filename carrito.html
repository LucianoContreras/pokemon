<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Carrito</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/imagenes/Pokedolares.webp">
</head>
<body>
    <nav>
        <div class="nav-wrapper">
            <a href="carrito.html" class="brand-logo">
                <img src="/estilos/imagenes/pokemon.webp"  class="logo">
            </a>
            <ul id="nav-mobile" class="right">
                <li class="nav-search-item">
                
                </li>
                   
                <li><a href="https://www.pokemon.com" target="_blank" rel="noopener noreferrer">Blogs</a></li>
                <li>
                    <a href="index.html">
                        <i class="material-icons">home</i>
                    </a>
                </li>
            </ul>
        </div>
        </nav>
        <main class="container-carrito">
        <div class="seccion-productos">
            <h2 class="titulo-carro">
            Carro <span id="cant-total-items"></span>
            </h2>
            <div id="contenedor-carro-items"></div>
        </div>
        <div class="seccion-resumen">
            <h3 class="resumen-titulo">Resumen de la compra</h3>
            <div class="card-resumen">
            <div class="resumen-linea">
                <span>Productos (<span id="resumen-cant-prod">0</span>)</span>
                <span id="resumen-subtotal">$0</span>
            </div>
            <div class="resumen-linea resumen-descuento">
                <span>Descuentos</span>
                <span id="resumen-descuento">-$0</span>
            </div>
            <div class="resumen-linea resumen-total">
                <span>Total:</span>
                <span id="resumen-total">$0</span>
            </div>
            <button id="btn-continuar-compra" class="btn btn-continuar-compra">
                Continuar compra
            </button>
            </div>
        </div>
        </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
